# Development override — use when default ports are occupied.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  backend:
    ports: !override
      - "127.0.0.1:8080:8000"
    environment:
      CORS_ORIGINS: '["http://127.0.0.1:3003","http://localhost:3003"]'

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    ports: !override
      - "127.0.0.1:3003:3000"
