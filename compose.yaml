name: afyaher

services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      - --data-dir
      - /data
      - --api-key
      - ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY in backend/.env}
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data

  backend:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000","http://127.0.0.1:3001","http://localhost:3001"]'
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY in backend/.env}
      TYPESENSE_COLLECTION: afyaher_knowledge_v2
      TYPESENSE_TIMEOUT_SECONDS: 3
    depends_on:
      typesense:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  typesense-data:
